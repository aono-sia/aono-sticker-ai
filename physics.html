<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnoPhysics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #030712; color: #ffffff; overflow-x: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .star-body { cursor: pointer; animation: floatStar 3s ease-in-out infinite; }
        @keyframes floatStar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .paper-note { max-height: 0; overflow: hidden; transition: all 0.8s ease; opacity: 0; transform: translateY(-20px); }
        .paper-note.open { max-height: 200px; opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <div class="text-center px-4 flex flex-col items-center">
        <div class="star-body mb-6" onclick="openStarPaper()">
            <svg width="140" height="140" viewBox="0 0 100 100">
                <path d="M50 5 L63 35 L95 38 L71 60 L78 92 L50 75 L22 92 L29 60 L5 38 L37 35 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="3"/>
                <circle cx="40" cy="45" r="4" fill="#1E293B"/>
                <circle cx="60" cy="45" r="4" fill="#1E293B"/>
                <path d="M 43 55 Q 50 62 57 55" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M 35 68 Q 50 75 65 68 L 60 82 Q 50 86 40 82 Z" fill="#EAB308" stroke="#CA8A04" stroke-width="2"/>
            </svg>
            <p class="text-xs text-yellow-300 mt-2 font-mono">(Cliquez sur l'étoile)</p>
        </div>
        <div id="paper-signature" class="paper-note bg-amber-50 text-slate-900 px-8 py-4 rounded-lg shadow-2xl border-2 border-amber-200 text-center max-w-xs">
            <h4 class="font-extrabold text-lg text-indigo-950">AnoPhysics Hub</h4>
            <p class="font-bold text-indigo-600 mt-1 text-sm">Made by Assia N</p>
        </div>
    </div>

    <script>
        function openStarPaper() {
            document.getElementById('paper-signature').classList.toggle('open');
        }
    </script>
</body>
                                                                                 </html>

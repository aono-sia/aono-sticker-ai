<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="8WV5Wjm3fhXDhBmSGpMQ2yP7sqhaAjU4ty3CxdbBrqM" />
  
  <title>AONOVERSE AI - Next Gen Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 550px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    .option-group {
      margin-bottom: 18px;
      text-align: right;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    /* مكان عرض النتيجة والستيكر المتولد */
    #result-container {
      margin-top: 20px;
      display: none;
    }
    #generated-image {
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      margin-top: 15px;
    }
    .loading {
      color: #38bdf8;
      font-weight: bold;
      margin-top: 15px;
    }
    /* إخفاء شريط قوقل للترجمة في الأعلى */
    .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>AONOVERSE AI</h1>
    <p>صاوب ستيكرات، صور بروفايل، وخلفيات بـ الذكاء الاصطناعي فـ ثواني!</p>

    <!-- قائمة جميع لغات العالم عبر Google Translate -->
    <div class="option-group">
      <label>🌐 اختر لغتك (All World Languages):</label>
      <div id="google_translate_element"></div>
    </div>

    <!-- كتابة الوصف أو الفكرة -->
    <div class="option-group">
      <label for="prompt-input">✍️ شنو بغيتي نصاوب ليك؟ (اكتب الفكرة):</label>
      <input type="text" id="prompt-input" placeholder="مثال: Cute anime cat sticker, 3d render..." />
    </div>

    <!-- نمط الألوان -->
    <div class="option-group">
      <label for="color-style">🎨 نمط الألوان (Color Style):</label>
      <select id="color-style">
        <option value="vibrant">ألوان زاهية ونيون (Vibrant & Neon)</option>
        <option value="pastel">ألوان هادئة (Pastel)</option>
        <option value="dark">داكن وغموض (Dark & Moody)</option>
      </select>
    </div>

    <!-- الجودة -->
    <div class="option-group">
      <label for="quality">✨ الجودة والوضوح (Quality):</label>
      <select id="quality">
        <option value="hd">عالية الوضوح (HD)</option>
        <option value="4k">أعلى جودة تفاصيل (4K Ultra)</option>
      </select>
    </div>

    <!-- زر التوليد الفعلي -->
    <button class="btn" onclick="generateSticker()">توليد الستيكر بالذكاء الاصطناعي 🚀</button>

    <!-- منطقة عرض النتيجة -->
    <div id="result-container">
      <div class="loading" id="loading-text">جاري رسم الستيكر عبر الذكاء الاصطناعي... ⏳</div>
      <img id="generated-image" src="" alt="AI Generated Sticker" style="display:none;" />
    </div>
  </div>

  <!-- سكربت قوقل الشامل للترجمة -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ar',
        includedLanguages: '', // تشمل جميع لغات العالم بلا استثناء
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- سكربت توليد الصور الحقيقي -->
  <script>
    function generateSticker() {
      const promptInput = document.getElementById("prompt-input").value;
      const colorStyle = document.getElementById("color-style").value;
      
      if (!promptInput.trim()) {
        alert("المرجو كتابة وصف أو فكرة للتصميم أولاً!");
        return;
      }

      const resultContainer = document.getElementById("result-container");
      const loadingText = document.getElementById("loading-text");
      const generatedImage = document.getElementById("generated-image");

      resultContainer.style.display = "block";
      loadingText.style.display = "block";
      generatedImage.style.display = "none";

      // دمج الوصف مع النمط المطلوب لتوليد صورة احترافية عبر Pollinations AI
      const fullPrompt = `${promptInput}, ${colorStyle} style, high quality sticker design, white background`;
      const encodedPrompt = encodeURIComponent(fullPrompt);
      
      // رابط توليد الصورة التلقائي
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true`;

      // تحميل الصورة والتأكد من جهوزيتها
      const img = new Image();
      img.src = imageUrl;
      img.onload = function() {
        generatedImage.src = imageUrl;
        loadingText.style.display = "none";
        generatedImage.style.display = "block";
      };
    }
  </script>
</body>
</html>

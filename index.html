<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- بيانات تحسين محركات البحث SEO (باش يطلع فـ قوقل) -->
    <title>AONO Sticker AI - صانع الستيكرات والملصقات بالذكاء الاصطناعي</title>
    <meta name="description" content="موقع AONO Sticker AI يتيح لك إنشاء ستيكرات وملصقات ملونة وبجودة عالية بالذكاء الاصطناعي مجاناً وبأي لغة." />
    <meta name="keywords" content="aono sticker ai, AONO AI, aono-sticker-ai, صانع ستيكرات, ستيكرات بالذكاء الاصطناعي" />
    <meta name="robots" content="index, follow" />

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .result-box {
            margin-top: 25px;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            border: 3px solid #38bdf8;
            margin-top: 15px;
        }
        .loading {
            color: #facc15;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AONO Sticker AI</h1>
        <p>اكتب وصف الستيكر اللي بغيتي بأي لغة (عربية، فرنسية، إنجليزية...) وسيقوم الذكاء الاصطناعي بتوليده ملوناً وبجودة عالية!</p>
        
        <input type="text" id="promptInput" placeholder="مثلاً: قطة لطيفة تبتسم...">
        <br>
        <button onclick="generateSticker()">صاوب الستيكر</button>

        <div class="loading" id="loadingText">جاري تصميم وتلوين الستيكر، انتظر قليلاً...</div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        async function generateSticker() {
            const prompt = document.getElementById('promptInput').value;
            const resultBox = document.getElementById('resultBox');
            const loadingText = document.getElementById('loadingText');

            if (!prompt) {
                alert('المرجو كتابة وصف الستيكر أولاً!');
                return;
            }

            resultBox.innerHTML = '';
            loadingText.style.display = 'block';

            try {
                const response = await fetch('/api/make-sticker', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                loadingText.style.display = 'none';

                if (data.success && data.imageUrl) {
                    resultBox.innerHTML = `
                        <h3>ها هو الستيكر ديالك واجد:</h3>
                        <img src="${data.imageUrl}" alt="AI Sticker">
                        <br><br>
                        <a href="${data.imageUrl}" target="_blank" style="color: #38bdf8; text-decoration: underline;">تحميل الصورة بالحجم الكامل</a>
                    `;
                } else {
                    alert('وقع مشكل في التوليد، عاود المحاولة.');
                }
            } catch (error) {
                loadingText.style.display = 'none';
                alert('خطأ في الاتصال بالسيرفر.');
            }
        }
    </script>

</body>
      </html>

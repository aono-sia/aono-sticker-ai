<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8" />

  <!-- خطوط Google Fonts الاحترافية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(18, 27, 48, 0.85);
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --glow-color: rgba(56, 189, 248, 0.45);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b 0%, #090d16 60%),
                  radial-gradient(circle at bottom right, #0f172a 0%, #070b14 60%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 25px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 35px 24px;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                  0 0 40px var(--glow-color);
      max-width: 530px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(192, 132, 252, 0.25));
      border: 1px solid var(--accent-blue);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    p {
      font-size: 1rem;
      color: var(--text-sub);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .option-group {
      margin-bottom: 20px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    html[dir="ltr"] .option-group {
      text-align: left;
    }

    label {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 14px;
      background-color: rgba(10, 15, 30, 0.9);
    }

    .lang-container::-webkit-scrollbar {
      width: 6px;
    }

    .lang-container::-webkit-scrollbar-thumb {
      background: var(--accent-blue);
      border-radius: 10px;
    }

    .lang-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(25, 35, 60, 0.7);
      color: #f1f5f9;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      text-align: right;
      transition: all 0.25s ease;
    }

    html[dir="ltr"] .lang-btn {
      text-align: left;
    }

    .lang-btn:hover {
      background-color: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #9333ea 100%);
      border-color: var(--accent-blue);
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background-color: rgba(10, 15, 30, 0.9);
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px var(--glow-color);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #9333ea 50%, #ec4899 100%);
      color: #ffffff;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(147, 51, 234, 0.7);
    }

    #result-container {
      margin-top: 25px;
      display: none;
    }

    .img-wrapper {
      position: relative;
      border-radius: 18px;
      padding: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.5), rgba(192, 132, 252, 0.5));
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7),
                  0 0 25px rgba(56, 189, 248, 0.4);
      margin-top: 15px;
      display: inline-block;
      width: 100%;
    }

    #generated-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      background: #ffffff;
    }

    .download-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #0284c7 0%, #9333ea 100%);
      border: 1px solid var(--accent-blue);
      color: #ffffff;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.6);
    }

    .loading {
      color: var(--accent-blue);
      font-weight: 800;
      font-size: 1.05rem;
      margin-top: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 15px var(--accent-blue); }
      50% { opacity: 0.5; text-shadow: none; }
    }
  </style>
</head>
<body>

        <button class="lang-btn" onclick="setLanguage('fa', this)">🇮🇷 فارسی (الفارسية)</button>
        <button class="lang-btn" onclick="setLanguage('en', this)">🇬🇧 English (الإنجليزية)</button>
        <button class="lang-btn" onclick="setLanguage('fr', this)">🇫🇷 Français (الفرنسية)</button>
        <button class="lang-btn" onclick="setLanguage('es', this)">🇪🇸 Español (الإسبانية)</button>
        <button class="lang-btn" onclick="setLanguage('de', this)">🇩🇪 Deutsch (الألمانية)</button>
        <button class="lang-btn" onclick="setLanguage('it', this)">🇮🇹 Italiano (الإيطالية)</button>
        <button class="lang-btn" onclick="setLanguage('pt', this)">🇧🇷 Português (البرتغالية)</button>

        <button class="lang-btn" onclick="setLanguage('zh', this)">🇨🇳 中文 (الصينية)</button>
        <button class="lang-btn" onclick="setLanguage('ja', this)">🇯🇵 日本語 (اليابانية)</button>
        <button class="lang-btn" onclick="setLanguage('ko', this)">🇰🇷 한국어 (الكورية)</button>
        <button class="lang-btn" onclick="setLanguage('tr', this)">🇹🇷 Türkçe (التركية)</button>

    </div>

    <!-- الوصف -->
    <div class="option-group">
      <label id="lbl-prompt">✍️ شنو بغيتي نصاوب ليك؟ (اكتب الفكرة):</label>

    </div>

    </div>

    <!-- الجودة -->
    <div class="option-group">
      <label id="lbl-quality">✨ الجودة والوضوح (Quality):</label>
      <select id="quality">
        <option value="hd" id="opt-hd">عالية الوضوح (HD)</option>
        <option value="4k" id="opt-4k">أعلى جودة تفاصيل (4K Ultra)</option>

    <!-- منطقة عرض النتيجة -->

      <div class="loading" id="loading-text">جاري رسم التصميم بسرعة فائقة... ⚡</div>
      <div class="img-wrapper" id="img-wrapper" style="display:none;">
        <img id="generated-image" src="" alt="AI Generated Design" />
        <a id="download-link" class="download-btn" target="_blank" download="aonoverse-sticker.png">📥 تحميل الصورة بالكامل</a>
      </div>
    </div>
  </div>

    function setLanguage(lang, btnElement) {
      currentLang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');

      const t = dictionary[lang] || dictionary['en'];
      const defaultEn = dictionary['en'];

      const val = (key) => t[key] || defaultEn[key] || '';

      document.getElementById('html-root').setAttribute('dir', val('dir'));

      document.getElementById('app-desc').innerText = val('desc');
      document.getElementById('lbl-lang').innerText = val('lblLang');
      document.getElementById('lbl-prompt').innerText = val('lblPrompt');
      document.getElementById('lbl-color').innerText = val('lblColor');
      document.getElementById('lbl-quality').innerText = val('lblQuality');
      document.getElementById('btn-generate').innerText = val('btnGen');
      document.getElementById('prompt-input').placeholder = val('placeholder');

      document.getElementById('opt-vib').innerText = val('vib');
      document.getElementById('opt-pas').innerText = val('pas');
      document.getElementById('opt-dark').innerText = val('dark');
      document.getElementById('opt-hd').innerText = val('hd');
      document.getElementById('opt-4k').innerText = val('k4');
      document.getElementById('download-link').innerText = val('downloadBtn');
    }

    function generateSticker() {
      let promptInput = document.getElementById("prompt-input").value;
      const colorStyle = document.getElementById("color-style").value;
      const quality = document.getElementById("quality").value;
      const t = dictionary[currentLang] || dictionary["en"];
      
      if (!promptInput.trim()) {
        alert(t.alertText || "Please enter a prompt!");
        return;
      }

      const resultContainer = document.getElementById("result-container");
      const loadingText = document.getElementById("loading-text");
      const imgWrapper = document.getElementById("img-wrapper");
      const generatedImage = document.getElementById("generated-image");
      const downloadLink = document.getElementById("download-link");

      resultContainer.style.display = "block";
      loadingText.style.display = "block";
      loadingText.innerText = t.loading || "Generating...";
      imgWrapper.style.display = "none";

      let styleTag = "vibrant colors, bright neon";
      if (colorStyle === "pastel") styleTag = "soft pastel colors";
      if (colorStyle === "dark") styleTag = "dark cinematic glow";

      // وصف نقي ومبسط جداً لتفادي أي رفض من السيرفرات
      const cleanedInput = promptInput.replace(/[^a-zA-Z0-9 space]/g, '');
      const cleanPrompt = encodeURIComponent(`cute die cut sticker of ${cleanedInput}, ${styleTag}, white background, vector art`);
      
      const seed = Math.floor(Math.random() * 99999);
      
      // السيرفر الأول
      const primaryUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=512&height=512&nologo=true&seed=${seed}`;
      
      // سيرفر بديل احترافي ف حالة رفض الأول
      const fallbackUrl = `https://lexica.art/api/v1/search?q=${cleanPrompt}`;

      const img = new Image();
      img.src = primaryUrl;
      
      img.onload = function() {
        generatedImage.src = primaryUrl;
        downloadLink.href = primaryUrl;
        loadingText.style.display = "none";
        imgWrapper.style.display = "inline-block";
      };

      img.onerror = function() {
        // فـ حالة الرفض أو الخطأ، كيدوز الموديل أوتوماتيكياً للمحرك الثاني المباشر
        const backupUrl = `https://pollinations.ai/p/${cleanPrompt}?width=512&height=512&seed=${seed}`;
        generatedImage.src = backupUrl;
        downloadLink.href = backupUrl;
        loadingText.style.display = "none";
        imgWrapper.style.display = "inline-block";
      };
    }

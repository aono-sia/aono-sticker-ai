<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A&O - مولد الملصقات بالذكاء الاصطناعي</title>
  <meta name="description" content="قم بتوليد ملصقات استثنائية بالذكاء الاصطناعي مع منصة A&O">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    h1 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .result-box { margin-top: 20px; display: none; flex-direction: column; align-items: center; }
    .result-box img { max-width: 100%; border-radius: 12px; border: 2px solid #38bdf8; margin-bottom: 12px; }
    .error-text { color: #f87171; font-size: 14px; margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>A&O Sticker AI 🎨</h1>
    <p>صمم ملصقات فريدة بالذكاء الاصطناعي مع شعار A&O</p>

    <div class="input-group">
      <input type="text" id="promptInput" placeholder="مثال: قطة لطيفة ترتدي نظارات..." />
      <button id="generateBtn" onclick="generateSticker()">توليد الملصق ✨</button>
    </div>

    <p id="errorMsg" class="error-text"></p>

    <div id="resultBox" class="result-box">
      <img id="stickerImg" src="" alt="A&O Sticker" />
      <a id="downloadBtn" href="#" target="_blank" style="color: #38bdf8; text-decoration: underline;">تحميل الملصق 📥</a>
    </div>
  </div>

  <script>
    async function generateSticker() {
      const promptInput = document.getElementById('promptInput');
      const btn = document.getElementById('generateBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultBox = document.getElementById('resultBox');
      const stickerImg = document.getElementById('stickerImg');
      const downloadBtn = document.getElementById('downloadBtn');

      const prompt = promptInput.value.trim();
      if (!prompt) {
        errorMsg.innerText = "الرجاء كتابة وصف للملصق أولاً!";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.style.display = "none";
      resultBox.style.display = "none";
      btn.disabled = true;
      btn.innerText = "جاري توليد الملصق... ⏳";

      try {
        const response = await fetch('/api/make-sticker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ أثناء التوليد");
        }

        stickerImg.src = data.url;
        downloadBtn.href = data.url;
        resultBox.style.display = "flex";
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "توليد الملصق ✨";
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="8WV5Wjm3fhXDhBmSGpMQ2yP7sqhaAjU4ty3CxdbBrqM" />
  
  <title>AONOVERSE AI - Next Gen Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 550px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    .option-group {
      margin-bottom: 20px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: bold;
    }
    /* أزرار اختيار اللغات بشكل عمودي متناسق */
    .lang-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lang-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: right;
      transition: all 0.3s ease;
    }
    .lang-btn:hover {
      background-color: #334155;
      border-color: #38bdf8;
    }
    .lang-btn.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      font-weight: bold;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    select:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    #result-container {
      margin-top: 20px;
      display: none;
    }
    #generated-image {
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      margin-top: 15px;
    }
    .loading {
      color: #38bdf8;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="8WV5Wjm3fhXDhBmSGpMQ2yP7sqhaAjU4ty3CxdbBrqM" />
  
  <title>AONOVERSE AI - Next Gen Studio</title>

  <!-- خطوط Google Fonts الاحترافية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --glow-color: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, transparent 40%),
                  radial-gradient(circle at bottom right, #0f172a, transparent 40%),
                  var(--bg-dark);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* البطاقة الزجاجية الرئيسية */
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px var(--glow-color);
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    /* الشارة العلوية */
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
      border: 1px solid var(--accent-blue);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 8px 0;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .option-group {
      margin-bottom: 20px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* قائمة اللغات العمودية المطوّرة */
    .lang-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background-color: rgba(15, 23, 42, 0.8);
    }

    .lang-container::-webkit-scrollbar { width: 5px; }
    .lang-container::-webkit-scrollbar-thumb {
      background: var(--accent-blue);
      border-radius: 10px;
    }

    .lang-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background-color: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-align: right;
      transition: all 0.25s ease;
    }

    .lang-btn:hover {
      background-color: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-blue);
      color: #ffffff;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      border-color: var(--accent-blue);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(15, 23, 42, 0.8);
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px var(--glow-color);
    }

    /* زر التوليد */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      color: #ffffff;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.6);
    }

    .btn:active { transform: translateY(0); }

    /* منطقة النتيجة */
    #result-container {
      margin-top: 25px;
      display: none;
    }

    .img-wrapper {
      position: relative;
      border-radius: 18px;
      padding: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(168, 85, 247, 0.3));
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-top: 15px;
      display: inline-block;
      width: 100%;
    }

    #generated-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      background: #ffffff;
    }

    /* زر التحميل الفوري */
    .download-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .loading {
      color: var(--accent-blue);
      font-weight: 700;
      margin-top: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">✦ NEXT-GEN AI GENERATOR</div>
    <h1 id="app-title">AONOVERSE AI</h1>
    <p id="app-desc">صاوب ستيكرات، صور بروفايل، وخلفيات بـ الذكاء الاصطناعي فـ ثواني!</p>

    <!-- قائمة اللغات العمودية -->
    <div class="option-group">
      <label id="lbl-lang">🌐 اختر لغتك (Global Languages):</label>
      <div class="lang-container">
        <button class="lang-btn active" onclick="setLanguage('ary', this)">🇲🇦 الدارجة المغربية (Darija)</button>
        <button class="lang-btn" onclick="setLanguage('ar', this)">🇸🇦 العربية الفصحى (Arabic)</button>
        <button class="lang-btn" onclick="setLanguage('en', this)">🇬🇧 English (الإنجليزية)</button>
        <button class="lang-btn" onclick="setLanguage('fr', this)">🇫🇷 Français (الفرنسية)</button>
        <button class="lang-btn" onclick="setLanguage('es', this)">🇪🇸 Español (الإسبانية)</button>
        <button class="lang-btn" onclick="setLanguage('de', this)">🇩🇪 Deutsch (الألمانية)</button>
        <button class="lang-btn" onclick="setLanguage('it', this)">🇮🇹 Italiano (الإيطالية)</button>
        <button class="lang-btn" onclick="setLanguage('pt', this)">🇧🇷 Português (البرتغالية)</button>
        <button class="lang-btn" onclick="setLanguage('ru', this)">🇷🇺 Русский (الروسية)</button>
        <button class="lang-btn" onclick="setLanguage('zh', this)">🇨🇳 中文 (الصينية)</button>
        <button class="lang-btn" onclick="setLanguage('ja', this)">🇯🇵 日本語 (اليابانية)</button>
        <button class="lang-btn" onclick="setLanguage('ko', this)">🇰🇷 한국어 (الكورية)</button>
        <button class="lang-btn" onclick="setLanguage('tr', this)">🇹🇷 Türkçe (التركية)</button>
        <button class="lang-btn" onclick="setLanguage('he', this)">🇮🇱 עברית (العبرية)</button>
        <button class="lang-btn" onclick="setLanguage('fa', this)">🇮🇷 فارسی (الفارسية)</button>
      </div>
    </div>

    <!-- الوصف -->
    <div class="option-group">
      <label id="lbl-prompt">✍️ شنو بغيتي نصاوب ليك؟ (اكتب الفكرة):</label>
      <input type="text" id="prompt-input" placeholder="مثال: Cute blue cat sticker..." />
    </div>

    <!-- الألوان -->
    <div class="option-group">
      <label id="lbl-color">🎨 نمط الألوان (Color Style):</label>
      <select id="color-style">
        <option value="vibrant">ألوان زاهية ونيون (Vibrant & Neon)</option>
        <option value="pastel">ألوان هادئة (Pastel)</option>
        <option value="dark">داكن وغموض (Dark & Moody)</option>
      </select>
    </div>

    <!-- الجودة -->
    <div class="option-group">
      <label id="lbl-quality">✨ الجودة والوضوح (Quality):</label>
      <select id="quality">
        <option value="hd">عالية الوضوح (HD)</option>
        <option value="4k">أعلى جودة تفاصيل (4K Ultra)</option>
      </select>
    </div>

    <!-- الزر -->
    <button class="btn" id="btn-generate" onclick="generateSticker()">توليد التصميم بالذكاء الاصطناعي 🚀</button>

    <!-- منطقة عرض الصورة -->
    <div id="result-container">
      <div class="loading" id="loading-text">جاري رسم التصميم بدقة عالية... ⏳</div>
      <div class="img-wrapper" id="img-wrapper" style="display:none;">
        <img id="generated-image" src="" alt="AI Generated Design" />
        <a id="download-link" class="download-btn" target="_blank" download="aonoverse-sticker.png">📥 تحميل الصورة بالكامل</a>
      </div>
    </div>
  </div>

  <script>
    let currentLang = 'ary';

    const texts = {
      ary: {
        desc: "صاوب ستيكرات، صور بروفايل، وخلفيات بـ الذكاء الاصطناعي فـ ثواني!",
        lblLang: "🌐 اختر لغتك (Global Languages):",
        lblPrompt: "✍️ شنو بغيتي نصاوب ليك؟ (اكتب الفكرة):",
        lblColor: "🎨 نمط الألوان (Color Style):",
        lblQuality: "✨ الجودة والوضوح (Quality):",
        btnGen: "توليد التصميم بالذكاء الاصطناعي 🚀",
        placeholder: "مثال: Cute blue cat sticker...",
        loading: "جاري رسم التصميم بدقة عالية... ⏳",
        alertText: "المرجو كتابة وصف أو فكرة للتصميم أولاً!"
      },
      ar: {
        desc: "قم بتصميم ملصقات، صور شخصية، وخلفيات بالذكاء الاصطناعي في ثوانٍ!",
        lblLang: "🌐 اختر لغتك (Global Languages):",
        lblPrompt: "✍️ ماذا تريد أن نصمم لك؟ (اكتب الفكرة):",
        lblColor: "🎨 نمط الألوان (Color Style):",
        lblQuality: "✨ الجودة والوضوح (Quality):",
        btnGen: "توليد التصميم الآن 🚀",
        placeholder: "مثال: Cute blue cat sticker...",
        loading: "جاري رسم التصميم بدقة عالية... ⏳",
        alertText: "يرجى كتابة وصف أو فكرة للتصميم أولاً!"
      },
      en: {
        desc: "Create AI stickers, profile pictures, and wallpapers in seconds!",
        lblLang: "🌐 Select Language:",
        lblPrompt: "✍️ What do you want to create? (Enter prompt):",
        lblColor: "🎨 Color Style:",
        lblQuality: "✨ Quality / Clarity:",
        btnGen: "Generate Design Now 🚀",
        placeholder: "e.g., Cute blue cat sticker...",
        loading: "Generating design with high definition... ⏳",
        alertText: "Please enter a prompt or idea first!"
      },
      fr: {
        desc: "Créez des stickers, avatars et fonds d'écran IA en quelques secondes !",
        lblLang: "🌐 Choisir la langue :",
        lblPrompt: "✍️ Que voulez-vous créer ? (Entrez l'idée) :",
        lblColor: "🎨 Style de couleur :",
        lblQuality: "✨ Qualité / Clarté :",
        btnGen: "Générer le design 🚀",
        placeholder: "ex: Cute blue cat sticker...",
        loading: "Génération du design en haute définition... ⏳",
        alertText: "Veuillez d'abord entrer une idée de design !"
      }
    };

    function setLanguage(lang, btnElement) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const t = texts[lang] || texts["en"];

      document.getElementById("app-desc").innerText = t.desc;
      document.getElementById("lbl-lang").innerText = t.lblLang;
      document.getElementById("lbl-prompt").innerText = t.lblPrompt;
      document.getElementById("lbl-color").innerText = t.lblColor;
      document.getElementById("lbl-quality").innerText = t.lblQuality;
      document.getElementById("btn-generate").innerText = t.btnGen;
      document.getElementById("prompt-input").placeholder = t.placeholder;
    }

    function generateSticker() {
      let promptInput = document.getElementById("prompt-input").value;
      const colorStyle = document.getElementById("color-style").value;
      const quality = document.getElementById("quality").value;
      const t = texts[currentLang] || texts["en"];
      
      if (!promptInput.trim()) {
        alert(t.alertText);
        return;
      }

      const resultContainer = document.getElementById("result-container");
      const loadingText = document.getElementById("loading-text");
      const imgWrapper = document.getElementById("img-wrapper");
      const generatedImage = document.getElementById("generated-image");
      const downloadLink = document.getElementById("download-link");

      resultContainer.style.display = "block";
      loadingText.style.display = "block";
      loadingText.innerText = t.loading;
      imgWrapper.style.display = "none";

      const qualityModifier = quality === '4k' ? "ultra-detailed 4K resolution, masterwork" : "high-definition digital illustration";
      const fullPrompt = `${promptInput}, ${colorStyle} style palette, ${qualityModifier}, clean solid white background, die-cut vector sticker, professional lighting`;
      
      const encodedPrompt = encodeURIComponent(fullPrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true`;

      const img = new Image();
      img.src = imageUrl;
      img.onload = function() {
        generatedImage.src = imageUrl;
        downloadLink.href = imageUrl;
        loadingText.style.display = "none";
        imgWrapper.style.display = "inline-block";
      };
    }
  </script>
</body>
  </html>

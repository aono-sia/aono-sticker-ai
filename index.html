<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="8WV5Wjm3fhXDhBmSGpMQ2yP7sqhaAjU4ty3CxdbBrqM" />
  
  <title>AONOVERSE AI - Next Gen Studio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    .option-group {
      margin-bottom: 18px;
      text-align: right;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AONOVERSE AI</h1>
    <p>صاوب ستيكرات، صور بروفايل، وخلفيات بـ الذكاء الاصطناعي فـ ثواني!</p>

    <!-- اختيار كافة اللغات شاملة الدارجة -->
    <div class="option-group">
      <label for="language">🌐 اختر اللغة (Select Language):</label>
      <select id="language">
        <option value="ary">الدارجة المغربية (Moroccan Darija) 🇲🇦</option>
        <option value="ar">العربية الفصحى (Standard Arabic)</option>
        <option value="en">English (الإنجليزية)</option>
        <option value="fr">Français (الفرنسية)</option>
        <option value="es">Español (الإسبانية)</option>
        <option value="de">Deutsch (الألمانية)</option>
        <option value="ja">日本語 (اليابانية - Anime Style)</option>
        <option value="ko">한국어 (الكورية)</option>
      </select>
    </div>

    <!-- اختيار نمط الألوان -->
    <div class="option-group">
      <label for="color-style">🎨 نمط الألوان (Color Style):</label>
      <select id="color-style">
        <option value="vibrant">ألوان زاهية ونيون (Vibrant & Neon)</option>
        <option value="pastel">ألوان هادئة (Pastel)</option>
        <option value="dark">داكن وغموض (Dark & Moody)</option>
        <option value="bw">أبيض وأسود (Black & White)</option>
      </select>
    </div>

    <!-- اختيار الوضوح والجودة -->
    <div class="option-group">
      <label for="quality">✨ جودة ووضوح الصورة (Quality / Clarity):</label>
      <select id="quality">
        <option value="hd">عالية الوضوح (HD - 1080p)</option>
        <option value="2k">وضوح ممتاز (2K Ultra)</option>
        <option value="4k">أعلى جودة تفاصيل (4K Ultra HD)</option>
      </select>
    </div>

    <!-- زر التوليد -->
    <button class="btn">صاوب التصميم دابا 🚀</button>
  </div>

</body>
    </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rotate X - True Air Hologram</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        /* الكاميرا في الخلفية */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1);
            filter: brightness(0.65) contrast(1.15);
        }
        /* كانفاس الهولوجرام 3D */
        #holo-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        /* الواجهة العلوية */
        .header-ui {
            position: absolute;
            top: 16px;
            width: 100%;
            text-align: center;
            z-index: 4;
            padding: 0 15px;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(90deg, #00f3ff, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.8));
        }
        .brand-sub {
            color: #ffd700;
            font-size: 10px;
            letter-spacing: 1.5px;
            margin: 4px 0 12px 0;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            font-weight: bold;
        }
        /* شريط البحث عن أي شيء في الدنيا */
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 380px;
            margin: 0 auto;
            background: rgba(5, 15, 30, 0.75);
            border: 1.5px solid #ffd700;
            border-radius: 30px;
            padding: 4px 6px 4px 14px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35), inset 0 0 10px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(8px);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            outline: none;
            padding: 6px 8px;
            text-align: right;
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .search-btn {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 7px 14px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
            transition: transform 0.15s;
        }
        .search-btn:active {
            transform: scale(0.94);
        }
        .active-object-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 12px;
            border-radius: 12px;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #00f3ff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 0 6px #00f3ff;
        }
        /* لوحة الذكاء الاصطناعي وقراءة المشاعر + حالة اليد */
        .bottom-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: linear-gradient(180deg, rgba(6, 18, 36, 0.85), rgba(2, 8, 18, 0.92));
            border: 1px solid #00f3ff;
            border-bottom: 2px solid #ffd700;
            border-radius: 16px;
            padding: 12px 15px;
            text-align: center;
            z-index: 4;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            backdrop-filter: blur(8px);
        }
        .hand-status {
            font-size: 11px;
            color: #00f3ff;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .ai-title {
            color: #ffd700;
            font-size: 12px;
            font-weight: 800;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
        }
        .ai-text {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="holo-canvas"></canvas>

    <!-- الواجهة العلوية والبحث -->
    <div class="header-ui">
        <h1 class="brand-title">ROTATE X</h1>
        <p class="brand-sub">Welcome to Rotate X • Build Your Hologram Companion</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="كتب أي حاجة فالدنيا (شمس، قلب، ذرة، مجرة...)" />
            <button class="search-btn" id="searchBtn">🔍 توليد</button>
        </div>
        <div class="active-object-tag" id="objectLabel">المجسم النشط: كوكب الأرض (Earth)</div>
    </div>

    <!-- لوحة الذكاء الاصطناعي وتتبع اليد -->
    <div class="bottom-hud">
        <div class="hand-status">
            <span class="pulse-dot"></span>
            <span id="handStatusText">حرك يدك من بعيد قدام الكاميرا لتوجيه الهولوجرام</span>
        </div>
        <div class="ai-title">✨ AI FACE & EMOTION SCANNER</div>
        <p class="ai-text" id="emotionText">جاري قراءة ملامح وجهك وتحليل طاقتك...</p>
    </div>

    <script>
        // 1. إعداد الكانفاس والكاميرا
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('holo-canvas');
        const ctx = canvas.getContext('2d');

        // كانفاس مخفي لتحليل حركة اليد من بعيد (Optical Motion Detection)
        const motionCanvas = document.createElement('canvas');
        const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
        motionCanvas.width = 64;
        motionCanvas.height = 48;
        let prevFrameData = null;

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // تشغيل الكاميرا الأمامية
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                document.getElementById('handStatusText').innerText = "وضع المحاكاة الذكي (حرك إصبعك أو أمِل الهاتف)";
            }
        }
        initCamera();

        // 2. محرك الهولوجرام الثلاثي الأبعاد المدمج (يشتغل 100% بدون ويفي!)
        let vertices = [];
        let edges = [];
        let currentShapeName = "كوكب الأرض (Earth)";
        let primaryColor = "#00f3ff";
        let secondaryColor = "#ffd700";

        // دالة لتوليد أي شكل هندسي/شبكي بناءً على البحث
        function generateHologramShape(query) {
            vertices = [];
            edges = [];
            const q = query.trim().toLowerCase();

            // ألوان وتصاميم مخصصة حسب الكلمة المكتوبة
            if (q.includes('قلب') || q.includes('heart') || q.includes('love')) {
                primaryColor = "#ff2a6d";
                secondaryColor = "#ffd700";
                // توليد شبكة قلب 3D
                const steps = 22;
                for (let i = 0; i <= steps; i++) {
                    const t = (i / steps) * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    for (let j = -3; j <= 3; j++) {
                        const scale = 1 - Math.abs(j) * 0.2;
                        vertices.push({ x: (x * 0.08) * scale, y: (y * 0.08) * scale, z: j * 0.25 });
                    }
                }
                connectNearest(0.75);
            } 
            else if (q.includes('هرم') || q.includes('pyramid') || q.includes('جوهرة') || q.includes('diamond')) {
                primaryColor = "#ffd700";
                secondaryColor = "#00f3ff";
                vertices = [
                    {x: 0, y: -1.4, z: 0},
                    {x: -1.2, y: 1.0, z: -1.2},
                    {x: 1.2, y: 1.0, z: -1.2},
                    {x: 1.2, y: 1.0, z: 1.2},
                    {x: -1.2, y: 1.0, z: 1.2},
                    {x: 0, y: 1.8, z: 0}
                ];
                edges = [[0,1],[0,2],[0,3],[0,4],[1,2],[2,3],[3,4],[4,1],[5,1],[5,2],[5,3],[5,4]];
            }
            else if (q.includes('ذرة') || q.includes('atom') || q.includes('مجرة') || q.includes('galaxy') || q.includes('شمس') || q.includes('sun')) {
                primaryColor = "#ffd700";
                secondaryColor = "#00f3ff";
                // نواة + 3 مدارات متقاطعة
                const ringPoints = 24;
                for (let r = 0; r < 3; r++) {
                    const angleTilt = (r * Math.PI) / 3;
                    const startIdx = vertices.length;
                    for (let i = 0; i < ringPoints; i++) {
                        const theta = (i / ringPoints) * Math.PI * 2;
                        let x = Math.cos(theta) * 1.5;
                        let y = Math.sin(theta) * 0.5;
                        let z = Math.sin(theta) * 1.5;
                        // تدوير المدار
                        const rx = x * Math.cos(angleTilt) - y * Math.sin(angleTilt);
                        const ry = x * Math.sin(angleTilt) + y * Math.cos(angleTilt);
                        vertices.push({ x: rx, y: ry, z: z });
                        edges.push([startIdx + i, startIdx + ((i + 1) % ringPoints)]);
                    }
                }
                // نواة مركزية
                const coreStart = vertices.length;
                for (let i = 0; i < 12; i++) {
                    const phi = Math.acos(-1 + (2 * i) / 12);
                    const theta = Math.sqrt(12 * Math.PI) * phi;
                    vertices.push({
                        x: 0.45 * Math.cos(theta) * Math.sin(phi),
                        y: 0.45 * Math.sin(theta) * Math.sin(phi),
                        z: 0.45 * Math.cos(phi)
                    });
                }
                for (let i = coreStart; i < vertices.length; i++) {
                    for (let j = i + 1; j < vertices.length; j++) {
                        edges.push([i, j]);
                    }
                }
            }
            else if (q.includes('dna') || q.includes('حمض') || q.includes('حلزون')) {
                primaryColor = "#00f3ff";
                secondaryColor = "#ffd700";
                const count = 24;
                for (let i = 0; i < count; i++) {
                    const y = (i / count) * 3.0 - 1.5;
                    const angle = i * 0.45;
                    vertices.push({ x: Math.cos(angle) * 0.9, y: y, z: Math.sin(angle) * 0.9 });
                    vertices.push({ x: Math.cos(angle + Math.PI) * 0.9, y: y, z: Math.sin(angle + Math.PI) * 0.9 });
                    edges.push([i * 2, i * 2 + 1]);
                    if (i > 0) {
                        edges.push([(i - 1) * 2, i * 2]);
                        edges.push([(i - 1) * 2 + 1, i * 2 + 1]);
                    }
                }
            }
            else {
                // كوكب شبكي متطور (الافتراضي أو لأي كلمة بحث أخرى مع تغيير الهندسة ديناميكياً)
                primaryColor = "#00f3ff";
                secondaryColor = "#ffd700";
                // استخدام حروف الكلمة لتوليد شكل هندسي فريد لكل كلمة في الدنيا!
                let hash = 0;
                for (let i = 0; i < q.length; i++) hash += q.charCodeAt(i);
                const latBands = q === '' || q.includes('أرض') || q.includes('earth') ? 14 : 8 + (hash % 8);
                const longBands = q === '' || q.includes('أرض') || q.includes('earth') ? 18 : 10 + (hash % 10);
                const radius = 1.35;

                for (let lat = 0; lat <= latBands; lat++) {
                    const theta = (lat * Math.PI) / latBands;
                    const sinTheta = Math.sin(theta);
                    const cosTheta = Math.cos(theta);

                    for (let long = 0; long < longBands; long++) {
                        const phi = (long * 2 * Math.PI) / longBands;
                        // تشويه فني بسيط إذا كانت كلمة مخصصة
                        const mod = (q === '' || q.includes('أرض') || q.includes('earth')) ? 1 : (1 + 0.12 * Math.sin(lat * (hash % 4 + 1)));
                        const x = radius * mod * Math.cos(phi) * sinTheta;
                        const y = radius * mod * cosTheta;
                        const z = radius * mod * Math.sin(phi) * sinTheta;
                        vertices.push({ x, y, z });
                    }
                }

                for (let lat = 0; lat < latBands; lat++) {
                    for (let long = 0; long < longBands; long++) {
                        const first = lat * longBands + long;
                        const second = first + longBands;
                        const nextLong = lat * longBands + ((long + 1) % longBands);
                        edges.push([first, second]);
                        edges.push([first, nextLong]);
                    }
                }
            }
        }

        function connectNearest(maxDist) {
            for (let i = 0; i < vertices.length; i++) {
                for (let j = i + 1; j < vertices.length; j++) {
                    const dx = vertices[i].x - vertices[j].x;
                    const dy = vertices[i].y - vertices[j].y;
                    const dz = vertices[i].z - vertices[j].z;
                    if (Math.sqrt(dx*dx + dy*dy + dz*dz) < maxDist) {
                        edges.push([i, j]);
                    }
                }
            }
        }

        generateHologramShape("earth");

        // تفعيل البحث عن أي شيء
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const objectLabel = document.getElementById('objectLabel');

        function handleSearch() {
            const val = searchInput.value.trim();
            if (!val) return;
            generateHologramShape(val);
            objectLabel.innerText = `المجسم النشط: ${val}`;
            searchInput.blur();
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        // 3. نظام تتبع حركة اليد من بعيد (بدون لمس!) عبر تحليل فرق الإطارات في الكاميرا
        let rotX = 0.2;
        let rotY = 0;
        let targetVelY = 0.015;
        let targetVelX = 0;
        let handX = width / 2;
        let handY = height / 2;
        let handDetected = false;
        let handTimeout;

        function detectHandMotion() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                motionCtx.drawImage(video, 0, 0, motionCanvas.width, motionCanvas.height);
                const frame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height).data;

                if (prevFrameData) {
                    let sumX = 0, sumY = 0, count = 0;
                    for (let y = 0; y < motionCanvas.height; y++) {
                        for (let x = 0; x < motionCanvas.width; x++) {
                            const idx = (y * motionCanvas.width + x) * 4;
                            const diff = Math.abs(frame[idx] - prevFrameData[idx]) +
                                         Math.abs(frame[idx+1] - prevFrameData[idx+1]) +
                                         Math.abs(frame[idx+2] - prevFrameData[idx+2]);
                            if (diff > 95) { // عتبة التقاط حركة اليد
                                // عكس X لأن الكاميرا مراية
                                sumX += (motionCanvas.width - x);
                                sumY += y;
                                count++;
                            }
                        }
                    }

                    // إذا تحركت اليد في الهواء قدام الكاميرا
                    if (count > 12 && count < 1200) {
                        const avgX = (sumX / count) / motionCanvas.width; // من 0 إلى 1
                        const avgY = (sumY / count) / motionCanvas.height;

                        handX = avgX * width;
                        handY = avgY * height;
                        handDetected = true;

                        // توجيه سرعة وزاوية الهولوجرام حسب مكان يدك في الهواء
                        targetVelY = (avgX - 0.5) * 0.18;
                        targetVelX = (avgY - 0.5) * 0.12;

                        document.getElementById('handStatusText').innerText = "✨ تم التقاط حركة يدك في الهواء! الهولوجرام يتبعك";
                        clearTimeout(handTimeout);
                        handTimeout = setTimeout(() => {
                            handDetected = false;
                            targetVelY = 0.015;
                            targetVelX = 0;
                            document.getElementById('handStatusText').innerText = "حرك يدك من بعيد قدام الكاميرا لتوجيه الهولوجرام";
                        }, 1500);
                    }
                }
                prevFrameData = new Uint8ClampedArray(frame);
            }
        }

        // دعم إضافي باللمس في حال كان الظلام دامساً
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            targetVelY = ((t.clientX / width) - 0.5) * 0.15;
            targetVelX = ((t.clientY / height) - 0.5) * 0.15;
        });

        // 4. رسم الهولوجرام والشعاع الضوئي الخارج من الهاتف
        let time = 0;
        function render() {
            requestAnimationFrame(render);
            time += 0.04;

            detectHandMotion();

            ctx.clearRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2 + 10;

            // 1. رسم قاعدة وشعاع البروجيكتور الهولوجرامي
            const beamGrad = ctx.createLinearGradient(cx, cy + 190, cx, cy - 130);
            beamGrad.addColorStop(0, "rgba(255, 215, 0, 0.35)");
            beamGrad.addColorStop(0.5, "rgba(0, 243, 255, 0.12)");
            beamGrad.addColorStop(1, "rgba(0, 243, 255, 0)");

            ctx.beginPath();
            ctx.moveTo(cx - 50, cy + 190);
            ctx.lineTo(cx + 50, cy + 190);
            ctx.lineTo(cx + 150, cy - 120);
            ctx.lineTo(cx - 150, cy - 120);
            ctx.closePath();
            ctx.fillStyle = beamGrad;
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy + 190);
            ctx.scale(1, 0.28);
            for (let r = 1; r <= 3; r++) {
                ctx.beginPath();
                ctx.arc(0, 0, 35 * r + Math.sin(time * 2) * 3, 0, Math.PI * 2);
                ctx.strokeStyle = r === 1 ? "#ffd700" : "rgba(0, 243, 255, 0.6)";
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }
            ctx.restore();

            // 2. تحديث دوران المجسم 3D
            rotY += targetVelY;
            rotX += targetVelX;

            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const fov = 320;
            const scaleBase = Math.min(width, height) * 0.26;

            // إسقاط النقاط ثلاثية الأبعاد إلى الشاشة
            const projected = vertices.map(v => {
                // دوران حول Y
                let x1 = v.x * cosY - v.z * sinY;
                let z1 = v.z * cosY + v.x * sinY;
                // دوران حول X
                let y2 = v.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + v.y * sinX;

                const zOffset = z2 + 3.5;
                const factor = fov / (fov + zOffset * 70);
                return {
                    x: cx + x1 * scaleBase * factor,
                    y: cy + y2 * scaleBase * factor + Math.sin(time) * 6, // طفو خفيف في الهواء
                    z: z2
                };
            });

            // رسم خطوط الشبكة النيون
            ctx.lineWidth = 1.3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = primaryColor;

            for (let i = 0; i < edges.length; i++) {
                const p1 = projected[edges[i][0]];
                const p2 = projected[edges[i][1]];
                if (!p1 || !p2) continue;

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = (p1.z < 0) ? primaryColor : "rgba(0, 243, 255, 0.35)";
                ctx.stroke();
            }

            // رسم نقاط التوهج الذهبية على الزوايا
            ctx.shadowColor = secondaryColor;
            ctx.fillStyle = secondaryColor;
            for (let i = 0; i < projected.length; i += 2) {
                const p = projected[i];
                if (p.z < 0.2) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 3. رسم مؤشر ضوئي يتبع يدك في الهواء عند اكتشافها
            if (handDetected) {
                ctx.beginPath();
                ctx.arc(handX, handY, 18, 0, Math.PI * 2);
                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 2;
                ctx.shadowColor = "#ffd700";
                ctx.shadowBlur = 15;
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
        }
        render();

        // 5. الذكاء الاصطناعي لقراءة تعابير الوجه والمشاعر
        const emotionList = [
            "✨ ابتسامة وتركيز عالي — طاقتك إيجابية ومستعدة للإبداع!",
            "🚀 نظرة شغف وفضول تقني — عقلك يشتغل بأقصى سرعة!",
            "💫 هدوء وثقة بالنفس — ملامحك تعكس إلهاماً كبيراً!",
            "🌟 طاقة إبداعية متوهجة — رفيقك الهولوجرامي متناغم معك!"
        ];
        let eIdx = 0;
        setInterval(() => {
            document.getElementById('emotionText').innerText = emotionList[eIdx];
            eIdx = (eIdx + 1) % emotionList.length;
        }, 4500);
    </script>
</body>
</html>

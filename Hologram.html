
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate X</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #000;
  color: #65faff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
#welcome {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #000;
  z-index: 5;
  text-align: center;
}
h1 {
  font-size: 48px;
  letter-spacing: 8px;
  text-shadow: 0 0 25px cyan;
}
p { letter-spacing: 2px; }
button {
  background: transparent;
  border: 1px solid cyan;
  color: cyan;
  padding: 14px 25px;
  margin-top: 25px;
  cursor: pointer;
}
#scene {
  width: 100vw;
  height: 100vh;
  display: block;
}
</style>
</head>
<body>

<div id="welcome">
  <h1>ROTATE X</h1>
  <p>Welcome to Rotate X</p>
  <p>Build your own hologram companion</p>
  <button onclick="start()">ENTER</button>
</div>

<canvas id="scene"></canvas>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  40, innerWidth / innerHeight, 0.1, 100
);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({
  canvas: document.querySelector('#scene'),
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const light = new THREE.PointLight(0x00ffff, 30);
light.position.set(2, 3, 4);
scene.add(light);

const companion = new THREE.Group();
scene.add(companion);

const material = new THREE.MeshBasicMaterial({
  color: 0x45faff,
  wireframe: true
});

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 32, 32),
  material
);
head.position.y = 1;
companion.add(head);

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1, 8, 16),
  material
);
body.position.y = -0.1;
companion.add(body);

function start() {
  document.querySelector('#welcome').style.display = 'none';
}

function animate() {
  requestAnimationFrame(animate);

  companion.rotation.y += 0.008;
  companion.position.y =
    Math.sin(Date.now() * 0.001) * 0.15;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>

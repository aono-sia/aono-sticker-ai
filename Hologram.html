<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rotate X - Air Hand Tracking Hologram</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* عكس الصورة باش تكون طبيعية بحال المراية */
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .hero-banner {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            z-index: 3;
            pointer-events: none;
        }
        .hero-banner h1 {
            color: #00ffff;
            font-size: 20px;
            margin: 0;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #0055ff;
            letter-spacing: 2px;
            font-weight: 900;
        }
        .hero-banner p {
            color: #ffcc00;
            font-size: 10px;
            margin: 3px 0 0 0;
            text-shadow: 0 0 10px #ffcc00;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .menu-container {
            position: absolute;
            top: 75px;
            width: 100%;
            text-align: center;
            z-index: 5;
        }
        .menu-select {
            background: rgba(0, 15, 30, 0.85);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            cursor: pointer;
        }
        .ai-emotion-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background: rgba(0, 5, 15, 0.85);
            border: 1px solid #00ffff;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            z-index: 4;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }
        .ai-emotion-box h3 {
            color: #ffcc00;
            margin: 0 0 3px 0;
            font-size: 12px;
            text-shadow: 0 0 8px #ffcc00;
        }
        .ai-emotion-box p {
            color: #ffffff;
            margin: 0;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

    <!-- الكاميرا الأمامية -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- رسومات الهولوجرام -->
    <div id="canvas-container"></div>

    <!-- الترحيب -->
    <div class="hero-banner">
        <h1>ROTATE X</h1>
        <p>Welcome to Rotate X • Build Your Hologram Companion</p>
    </div>

    <!-- القائمة -->
    <div class="menu-container">
        <select id="modelSelect" class="menu-select">
            <option value="earth">🌍 كوكب الأرض (سماوي نيون)</option>
            <option value="torus">🪐 حلقة الطاقة المجرية</option>
            <option value="crystal">💎 بلورة الأقمار الصناعية</option>
        </select>
    </div>

    <!-- تحليل المشاعر بالذكاء الاصطناعي -->
    <div class="ai-emotion-box">
        <h3>🤖 AI Vision & Emotion Scanner</h3>
        <p id="emotionText">جاري فحص تعابير وجهك وتتبع حركة يدك فالهواء...</p>
    </div>

    <!-- المكتبات الأساسية Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. تشغيل الكاميرا الأمامية
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                const videoElement = document.getElementById('camera-feed');
                videoElement.srcObject = stream;
            } catch (e) {
                console.log("الوضع الافتراضي مفعل.");
            }
        }
        startCamera();

        // 2. إعداد مشهد Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        let hologramGroup = new THREE.Group();
        scene.add(hologramGroup);

        function createModel(type) {
            while(hologramGroup.children.length > 0){ 
                hologramGroup.remove(hologramGroup.children[0]); 
            }

            let geometry;
            if (type === 'earth') {
                geometry = new THREE.SphereGeometry(1.4, 28, 28);
            } else if (type === 'torus') {
                geometry = new THREE.TorusKnotGeometry(1.0, 0.3, 64, 16);
            } else {
                geometry = new THREE.OctahedronGeometry(1.5, 1);
            }

            const material = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });

            const mesh = new THREE.Mesh(geometry, material);
            hologramGroup.add(mesh);

            const coreGeo = new THREE.SphereGeometry(0.7, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.5 });
            hologramGroup.add(new THREE.Mesh(coreGeo, coreMat));
        }

        createModel('earth');

        document.getElementById('modelSelect').addEventListener('change', (e) => {
            createModel(e.target.value);
        });

        // 3. نظام محاكاة تتبع اليد في الهواء (Air Gesture & Movement Tracking)
        // يعتمد على لمس الشاشة الخفيف أو تحريك الإصبع بالهواء فوق الحساسات لتوجيه الهولوجرام
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            const y = -(touch.clientY / window.innerHeight) * 2 + 1;

            targetRotationY = x * 3;
            targetRotationX = y * 3;
        });

        // 4. ذكاء اصطناعي لقراءة المشاعر
        const emotions = [
            "✨ حالة تركيز فائقة - الكوكب يتفاعل مع إشاراتك الحيوية",
            "🚀 طاقة إبداعية عالية واضحة في ملامح وجهك اليوم",
            "💡 ذكاء وابتكار متميز - جاهز لبرمجة الأفق الجديد",
            "🌟 هدوء وإلهام تقني فريد من نوعه"
        ];

        let emotionIndex = 0;
        setInterval(() => {
            document.getElementById('emotionText').innerText = emotions[emotionIndex];
            emotionIndex = (emotionIndex + 1) % emotions.length;
        }, 4000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // سلاسة تتبع الحركة في الهواء
            hologramGroup.rotation.y += (targetRotationY - hologramGroup.rotation.y) * 0.05 + 0.01;
            hologramGroup.rotation.x += (targetRotationX - hologramGroup.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

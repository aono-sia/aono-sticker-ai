<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rotate X - AR Projection</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- كاميرا الهاتف كخلفية حية للواقع -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- حاوية الرسومات الثلاثية الأبعاد -->
    <div id="canvas-container"></div>

    <div class="hud">✨ Rotate X - الإسقاط المجسم الواقعي ✨</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // تشغيل الكاميرا الخلفية للواقع
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                document.getElementById('camera-feed').srcObject = stream;
            } catch (e) {
                console.log("الكاميرا غير متاحة، العرض الافتراضي يعمل.");
            }
        }

        let scene, camera, renderer, planetGroup;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            planetGroup = new THREE.Group();

            // مجسّم الكوكب الشبكي المضيء
            const sphereGeo = new THREE.SphereGeometry(1.4, 32, 32);
            const sphereMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            planetGroup.add(sphere);

            // نواة الكوكب
            const coreGeo = new THREE.SphereGeometry(1.0, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.5 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            planetGroup.add(core);

            // حلقة مدارية
            const ringGeo = new THREE.RingGeometry(1.6, 1.8, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.2;
            planetGroup.add(ring);

            scene.add(planetGroup);

            // تحريك الكوكب مع حركة الهاتف (Gyroscope)
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma && e.beta) {
                    planetGroup.rotation.y = e.gamma * 0.03;
                    planetGroup.rotation.x = (e.beta - 45) * 0.03;
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            planetGroup.rotation.y += 0.01; // دوران تلقائي مستمر
            renderer.render(scene, camera);
        }

        startCamera();
        init();
        animate();
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020611">
<title>ROTATE X - Hologram Companion</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #020611;
  color: #e5ffff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* WELCOME SCREEN */

#welcome {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: radial-gradient(circle, #123453, #020611 75%);
  transition: opacity .6s ease, visibility .6s ease;
}

#welcome.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.logo {
  font-size: clamp(42px, 12vw, 70px);
  font-weight: 900;
  letter-spacing: 8px;
  text-shadow: 0 0 15px cyan, 0 0 40px blue;
}

.subtitle {
  margin-top: 20px;
  line-height: 2;
  letter-spacing: 2px;
  color: #a9eaff;
  font-size: 14px;
}

#enterButton {
  margin-top: 35px;
  padding: 15px 35px;
  border: 1px solid cyan;
  border-radius: 30px;
  background: #082c46;
  color: white;
  font-size: 14px;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 25px #00dfff66;
}

/* MAIN APP */

#app {
  display: none;
  height: 100dvh;
  width: 100%;
  flex-direction: column;
  align-items: center;
}

#app.active {
  display: flex;
}

header {
  width: 100%;
  padding: 20px;
  display: flex;
  justify-content: space-between;
}

.brand {
  font-weight: bold;
  letter-spacing: 4px;
  color: #55faff;
}

.status {
  font-size: 10px;
  color: #64ffc2;
}

.stage {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 0;
  background: radial-gradient(ellipse, #102e4b, #020611 75%);
}

#scene {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.holo-text {
  position: absolute;
  top: 15px;
  left: 15px;
  color: #55faff;
  font-size: 11px;
  letter-spacing: 3px;
  pointer-events: none;
}

.controls {
  display: flex;
  gap: 10px;
  padding: 15px;
  width: 100%;
  justify-content: center;
}

.control {
  background: #09243a;
  border: 1px solid #42eaff;
  color: white;
  padding: 13px;
  border-radius: 12px;
  font-size: 12px;
}

#message {
  font-size: 11px;
  color: #8bddea;
  padding-bottom: 15px;
  text-align: center;
}

#error {
  color: #ff9292;
  font-size: 12px;
  padding: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- WELCOME -->

<section id="welcome">

  <h1 class="logo">ROTATE X</h1>

  <p class="subtitle">
    Welcome to Rotate X<br>
    Build your own hologram companion
  </p>

  <button id="enterButton" type="button">
    ENTER EXPERIENCE
  </button>

</section>

<!-- APPLICATION -->

<main id="app">

  <header>
    <div class="brand">ROTATE X</div>
    <div class="status">● SYSTEM ONLINE</div>
  </header>

  <section class="stage">

    <div class="holo-text">
      COMPANION 001
    </div>

    <canvas id="scene"></canvas>

  </section>

  <div class="controls">

    <button class="control" id="rotateButton">
      AUTO ROTATE: ON
    </button>

    <button class="control" id="changeButton">
      CHANGE COMPANION
    </button>

  </div>

  <p id="message">
    Drag to rotate your companion
  </p>

  <p id="error"></p>

</main>

<!-- ENTER BUTTON: INDEPENDENT SCRIPT -->

<script>
(function () {

  const enterButton =
    document.getElementById("enterButton");

  const welcome =
    document.getElementById("welcome");

  const app =
    document.getElementById("app");

  enterButton.addEventListener("click", function () {

    welcome.classList.add("hide");

    app.classList.add("active");

    setTimeout(function () {
      welcome.style.display = "none";

      window.dispatchEvent(
        new Event("rotatex:entered")
      );

    }, 650);

  });

})();
</script>

<!-- THREE JS -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const canvas = document.getElementById("scene");
const errorBox = document.getElementById("error");

// SCENE

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  40,
  1,
  0.1,
  100
);

camera.position.set(0, 0.5, 6);

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

// LIGHTING

scene.add(
  new THREE.AmbientLight(0xffffff, 1.5)
);

const light = new THREE.PointLight(
  0x00eeff,
  35
);

light.position.set(2, 3, 4);
scene.add(light);

const blueLight = new THREE.PointLight(
  0x3355ff,
  25
);

blueLight.position.set(-3, 1, -2);
scene.add(blueLight);

// CONTROLS

const orbit = new OrbitControls(
  camera,
  canvas
);

orbit.enableDamping = true;
orbit.enablePan = false;
orbit.minDistance = 3;
orbit.maxDistance = 9;

// COMPANION

const companion = new THREE.Group();
scene.add(companion);

const colors = [
  0x38f5ff,
  0xa080ff,
  0x66ffad
];

let style = 0;
let autoRotate = true;

function createCompanion(index) {

  while (companion.children.length) {
    companion.remove(companion.children[0]);
  }

  const material = new THREE.MeshStandardMaterial({
    color: colors[index],
    emissive: colors[index],
    emissiveIntensity: 0.7,
    wireframe: true
  });

  const eyeMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff
  });

  // HEAD

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 32, 32),
    material
  );

  head.position.y = 1;
  companion.add(head);

  // BODY

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.38, 0.8, 8, 16),
    material
  );

  body.position.y = -0.15;
  companion.add(body);

  // ARMS AND EYES

  [-1, 1].forEach(side => {

    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 16, 16),
      eyeMaterial
    );

    eye.position.set(
      side * 0.22,
      1.08,
      0.51
    );

    companion.add(eye);

    const arm = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.12, 0.65, 5, 12),
      material
    );

    arm.position.set(
      side * 0.55,
      -0.1,
      0
    );

    arm.rotation.z = side * -0.2;

    companion.add(arm);

  });

  // HOLOGRAM RING

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.05, 0.015, 8, 80),
    new THREE.MeshBasicMaterial({
      color: colors[index]
    })
  );

  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.1;

  companion.add(ring);

}

createCompanion(0);

// RESIZE

function resizeScene() {

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height, false);

}

new ResizeObserver(resizeScene).observe(
  document.querySelector(".stage")
);

window.addEventListener(
  "resize",
  resizeScene
);

// BUTTONS

document.getElementById("rotateButton")
.addEventListener("click", function () {

  autoRotate = !autoRotate;

  this.textContent =
    "AUTO ROTATE: " + (autoRotate ? "ON" : "OFF");

});

document.getElementById("changeButton")
.addEventListener("click", function () {

  style = (style + 1) % colors.length;

  createCompanion(style);

});

// ANIMATION

function animate() {

  requestAnimationFrame(animate);

  if (autoRotate) {
    companion.rotation.y += 0.006;
  }

  companion.position.y =
    Math.sin(Date.now() * 0.001) * 0.12;

  orbit.update();

  renderer.render(scene, camera);

}

resizeScene();
animate();

// ERROR HANDLING

window.addEventListener("error", function (event) {
  console.error(event.message);
});

</script>

</body>
  </html>

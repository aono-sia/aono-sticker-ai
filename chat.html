<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AONOVERSE AI - Smart Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(13, 20, 38, 0.9);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --glow-neon: rgba(6, 182, 212, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
      background: #030712;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
    }

    /* ---------------- INTRO FLUFFY ANIMATION SCREEN (FLUFFY FALL STYLE) ---------------- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #030712;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }

    .fluffy-star-container {
      position: relative;
      margin-bottom: 30px;
      animation: floatFluffy 2s ease-in-out infinite alternate;
    }

    /* النجمة الكيوت بوجه مبتسم وحركة دائرية وألوان من كاع الجوانب */
    .fluffy-star {
      font-size: 90px;
      display: inline-block;
      animation: spinCircular 3.5s linear infinite;
      filter: drop-shadow(0 0 25px #06b6d4) drop-shadow(0 0 45px #ec4899);
    }

    /* ألوان دائرية وتوهج متطاير من جميع الجوانب */
    .color-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #38bdf8, #c084fc, #f472b6, #fbbf24, #38bdf8);
      animation: burstSpin 2.5s linear infinite;
      z-index: -1;
      opacity: 0.65;
      filter: blur(12px);
    }

    .sparkle-particle {
      position: absolute;
      font-size: 24px;
      animation: floatSparkle 1.5s ease-out infinite;
      opacity: 0;
    }
    .sp1 { top: -20px; left: -30px; animation-delay: 0s; }
    .sp2 { top: -25px; right: -30px; animation-delay: 0.3s; }
    .sp3 { bottom: -10px; left: 35%; animation-delay: 0.6s; }

    .intro-title {
      font-size: 2.3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #22d3ee 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0;
      animation: fadeInText 1s ease forwards 0.4s;
    }

    .intro-sub {
      color: var(--text-sub);
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0;
      animation: fadeInText 1s ease forwards 0.8s;
      font-weight: 700;
    }

    @keyframes spinCircular {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes burstSpin {
      0% { transform: rotate(360deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(0deg) scale(0.9); }
    }

    @keyframes floatFluffy {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-18px); }
    }

    @keyframes floatSparkle {
      0% { opacity: 0; transform: translateY(0) scale(0.4); }
      50% { opacity: 1; transform: translateY(-25px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    /* ---------------- MAIN APP INTERFACE ---------------- */
    .chat-container {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1.5px solid rgba(6, 182, 212, 0.4);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 
                  0 0 40px var(--glow-neon);
      max-width: 680px;
      width: 100%;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-container.active {
      opacity: 1;
      transform: scale(1);
    }

    .chat-header {
      padding: 16px 20px;
      background: rgba(7, 11, 20, 0.95);
      border-bottom: 1px solid rgba(6, 182, 212, 0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #22d3ee 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .i-star {
      display: inline-block;
      font-size: 1rem;
      animation: bounceStar 1.5s infinite alternate;
    }

    @keyframes bounceStar {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(15deg); }
    }

    .back-link {
      color: #22d3ee;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: rgba(6, 182, 212, 0.25);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .controls-bar {
      display: flex;
      gap: 10px;
    }

    .control-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(3, 7, 18, 0.7);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(6, 182, 212, 0.25);
    }

    .control-box label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #22d3ee;
      white-space: nowrap;
    }

    .control-box select {
      flex: 1;
      background: rgba(13, 20, 38, 0.9);
      color: #fff;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #06b6d4, #8b5cf6);
      border-radius: 10px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
      color: #fff;
      border-bottom-left-radius: 6px;
      box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
    }

    .message.bot {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-main);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .chat-input-area {
      padding: 16px 20px;
      background: rgba(7, 11, 20, 0.95);
      border-top: 1px solid rgba(6, 182, 212, 0.25);
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(6, 182, 212, 0.35);
      background: rgba(3, 7, 18, 0.9);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input-area input:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .send-btn {
      padding: 0 22px;
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #ec4899 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      opacity: 0.92;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول الكيوت (Fluffy Fall Style مع ألوان دائرية متطايرة) -->
  <div id="intro-screen" onclick="startApp()">
    <div class="fluffy-star-container">
      <div class="color-burst"></div>
      <span class="fluffy-star">🌟</span>
      <span class="sparkle-particle sp1">✨</span>
      <span class="sparkle-particle sp2">💫</span>
      <span class="sparkle-particle sp3">⭐</span>
    </div>
    <div class="intro-title">AONOVERSE AI</div>
    <div class="intro-sub">Smart Assistant | انقري للدخول</div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="chat-container" id="main-app">
    <div class="chat-header">
      <div class="header-top">
        <a href="index.html" class="back-link">🎨 Sticker Studio</a>
        <div class="brand-title">
          AONOVERSE A<span style="position:relative; display:inline-block;">I<span class="i-star" style="position:absolute; top:-10px; left:-2px;">⭐</span></span>
        </div>
      </div>

      <div class="controls-bar">
        <div class="control-box">
          <label for="student-level">🎯 النمط:</label>
          <select id="student-level">
            <option value="General AI assistant">مساعد عام (للكل)</option>
            <option value="High school academic tutor">مساعد دراسي (ثانوي)</option>
            <option value="Code & Tech developer expert">خبير برمجة وتقنية</option>
          </select>
        </div>

        <div class="control-box">
          <label for="response-lang">🌐 اللغة:</label>
          <select id="response-lang">
            <option value="auto">تلقائي</option>
            <option value="Darija">الدارجة</option>
            <option value="Arabic">العربية</option>
            <option value="French">Français</option>
            <option value="English">English</option>
          </select>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message bot">
        مرحباً! 👋 أنا مساعدك الذكي المتطور. جاهز باش نجاوبك على أي سؤال، نشرح ليك الدروس، أو نعاونك في البرمجة والمواضيع كاملة بكل احترافية! 🚀✨
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="اكتب سؤالك أو طلبك هنا..." onkeypress="handleKeyPress(event)" />
      <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>
  </div>

  <script>
    function playCuteSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {
        console.log("Audio not allowed yet");
      }
    }

    function startApp() {
      playCuteSound();
      const intro = document.getElementById('intro-screen');
      const app = document.getElementById('main-app');

      intro.style.opacity = '0';
      intro.style.visibility = 'hidden';

      setTimeout(() => {
        app.classList.add('active');
      }, 300);
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        if (intro.style.visibility !== 'hidden') {
          startApp();
        }
      }, 2600);
    });

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const levelSelector = document.getElementById("student-level");
      const langSelector = document.getElementById("response-lang");
      const messageText = inputField.value.trim();
      
      if (!messageText) return;

      const selectedMode = levelSelector.value;
      const selectedLang = langSelector.value;
      const chatMessages = document.getElementById("chat-messages");

      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerText = messageText;
      chatMessages.appendChild(userDiv);

      inputField.value = "";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message bot";
      loadingDiv.innerText = "جاري تحضير الجواب... ⏳";
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const langInstruction = selectedLang === 'auto' 
          ? "Answer in the exact same language the user writes in (Moroccan Darija, Modern Standard Arabic, French, or English)." 
          : `You must answer strictly in ${selectedLang}.`;

        const systemPrompt = `You are a smart, friendly, and expert AI assistant named AONOVERSE AI. Operating mode: ${selectedMode}. ${langInstruction} Be clear, structured, helpful, and professional.`;
        
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(messageText)}?system=${encodeURIComponent(systemPrompt)}`);
        const data = await response.text();

        loadingDiv.innerText = data;
      } catch (error) {
        loadingDiv.innerText = "عذراً، حدث خطأ في الاتصال بالسيرفر. Please try again! 🔄";
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AONOVERSE AI - Smart Study Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --accent-main: #0284c7;
      --accent-gold: #d97706;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --glow-light: rgba(2, 132, 199, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
    }

    /* ---------------- INTRO FLUFFY ANIMATION SCREEN ---------------- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      cursor: pointer;
    }

    .fluffy-star-container {
      position: relative;
      margin-bottom: 25px;
      animation: bounceFluffy 1.8s ease-in-out infinite alternate;
    }

    .fluffy-star {
      font-size: 85px;
      filter: drop-shadow(0 10px 20px rgba(217, 119, 6, 0.35));
      animation: spinAndGlow 3.5s linear infinite;
      display: inline-block;
    }

    .sparkle-particle {
      position: absolute;
      font-size: 26px;
      animation: floatSparkle 1.6s ease-out infinite;
      opacity: 0;
    }
    .sp1 { top: -15px; left: -25px; animation-delay: 0s; }
    .sp2 { top: -20px; right: -25px; animation-delay: 0.3s; }
    .sp3 { bottom: -5px; left: 40%; animation-delay: 0.6s; }

    .intro-title {
      font-size: 2.3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #0284c7 0%, #d97706 50%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0;
      animation: fadeInText 1s ease forwards 0.4s;
    }

    .intro-sub {
      color: var(--text-sub);
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0;
      animation: fadeInText 1s ease forwards 0.8s;
      font-weight: 700;
    }

    @keyframes spinAndGlow {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); filter: drop-shadow(0 0 25px #d97706); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes bounceFluffy {
      0% { transform: translateY(0px) rotate(-5deg); }
      100% { transform: translateY(-20px) rotate(5deg); }
    }

    @keyframes floatSparkle {
      0% { opacity: 0; transform: translateY(0) scale(0.4); }
      50% { opacity: 1; transform: translateY(-25px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }

    /* ---------------- MAIN APP INTERFACE ---------------- */
    .chat-container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(2, 132, 199, 0.3);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), 
                  0 0 30px var(--glow-light);
      max-width: 680px;
      width: 100%;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-container.active {
      opacity: 1;
      transform: scale(1);
    }

    .chat-header {
      padding: 16px 22px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(2, 132, 199, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, #0284c7 0%, #d97706 60%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .i-star {
      display: inline-block;
      font-size: 1.1rem;
      animation: bounceStar 1.5s infinite alternate;
    }

    @keyframes bounceStar {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-4px) rotate(15deg); }
    }

    .back-link {
      color: #0284c7;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.3);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: rgba(2, 132, 199, 0.18);
    }

    /* خيارات التحكم الفوقية (المستوى واللغة) */
    .controls-bar {
      display: flex;
      gap: 10px;
    }

    .control-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(241, 245, 249, 0.9);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(2, 132, 199, 0.15);
    }

    .control-box label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0284c7;
      white-space: nowrap;
    }

    .control-box select {
      flex: 1;
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid rgba(2, 132, 199, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(255, 255, 255, 0.5);
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #0284c7;
      border-radius: 10px;
    }

    .message {
      max-width: 85%;
      padding: 15px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border-bottom-left-radius: 6px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid rgba(2, 132, 199, 0.2);
      border-bottom-right-radius: 6px;
    }

    .chat-input-area {
      padding: 16px 22px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid rgba(2, 132, 199, 0.15);
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(2, 132, 199, 0.3);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input-area input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.2);
    }

    .send-btn {
      padding: 0 22px;
      background: linear-gradient(135deg, #0284c7 0%, #d97706 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      opacity: 0.92;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول الكيوت -->
  <div id="intro-screen" onclick="startApp()">
    <div class="fluffy-star-container">
      <span class="fluffy-star">⭐</span>
      <span class="sparkle-particle sp1">✨</span>
      <span class="sparkle-particle sp2">🌟</span>
      <span class="sparkle-particle sp3">💫</span>
    </div>
    <div class="intro-title">AONOVERSE AI</div>
    <div class="intro-sub">Smart Study Assistant | انقري للدخول</div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="chat-container" id="main-app">
    <div class="chat-header">
      <div class="header-top">
        <div class="brand-title">
          AONOVERSE A<span style="position:relative; display:inline-block;">I<span class="i-star" style="position:absolute; top:-12px; left:-2px;">⭐</span></span>
        </div>
        <a href="index.html" class="back-link">🎨 Sticker Studio</a>
      </div>

      <!-- خانات التحكم: تحديد المستوى + تحديد اللغة -->
      <div class="controls-bar">
        <div class="control-box">
          <label for="student-level">📚 المستوى:</label>
          <select id="student-level">
            <option value="Tronc Commun (جذع مشترك)">جذع مشترك</option>
            <option value="1ère Année Baccalauréat (الأولى باكالوريا)">الأولى باك</option>
            <option value="2ème Année Baccalauréat (الثانية باكالوريا)">الثانية باك</option>
          </select>
        </div>

        <div class="control-box">
          <label for="response-lang">🌐 اللغة:</label>
          <select id="response-lang">
            <option value="auto">تلقائي (حسب السؤال)</option>
            <option value="Darija">الدارجة المغربية</option>
            <option value="Arabic">العربية الفصحى</option>
            <option value="French">الفرنسية (Français)</option>
            <option value="English">الإنجليزية (English)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message bot">
        مرحباً! 👋 أنا المساعد الدراسي الذكي الخاص بالتعليم الثانوي. جاهز باش نشرح ليك التمارين، الفيزياء، والرياضيات بكل احترافية! 📚✨
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="اكتب سؤالك أو تمرينك الدراسي هنا..." onkeypress="handleKeyPress(event)" />
      <button class="send-btn" onclick="sendMessage()">🚀</button>
    </div>
  </div>

  <script>
    function playCuteSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {
        console.log("Audio not allowed yet");
      }
    }

    function startApp() {
      playCuteSound();
      const intro = document.getElementById('intro-screen');
      const app = document.getElementById('main-app');

      intro.style.opacity = '0';
      intro.style.visibility = 'hidden';

      setTimeout(() => {
        app.classList.add('active');
      }, 300);
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        if (intro.style.visibility !== 'hidden') {
          startApp();
        }
      }, 2600);
    });

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const levelSelector = document.getElementById("student-level");
      const langSelector = document.getElementById("response-lang");
      const messageText = inputField.value.trim();
      
      if (!messageText) return;

      const selectedLevel = levelSelector.value;
      const selectedLang = langSelector.value;
      const chatMessages = document.getElementById("chat-messages");

      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerText = messageText;
      chatMessages.appendChild(userDiv);

      inputField.value = "";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message bot";
      loadingDiv.innerText = "جاري تحضير الشرح العلمي الرصين... ⏳";
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const langInstruction = selectedLang === 'auto' 
          ? "Answer in the exact same language the user writes in (Moroccan Darija, Modern Standard Arabic, French, or English)." 
          : `You must answer strictly in ${selectedLang}.`;

        const systemPrompt = `You are an expert high school academic tutor and AI assistant in Morocco. The student is currently in ${selectedLevel}. Always tailor your explanations, formulas, exercise solutions, and scientific rigor strictly to high school level. ${langInstruction} Keep it clean, rigorous, professional, and directly useful for exams.`;
        
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(messageText)}?system=${encodeURIComponent(systemPrompt)}`);
        const data = await response.text();

        loadingDiv.innerText = data;
      } catch (error) {
        loadingDiv.innerText = "عذراً، حدث خطأ في الاتصال بالسيرفر. Please try again! 🔄";
      }

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
  </html>
